<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>DOS Games</title>
<link rel="stylesheet" href="vendor/js-dos8/js-dos.css?v=2">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:#000; color:#eaeaea; overflow:hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { position:fixed; inset:0; display:flex; flex-direction:column; }
  #stage { position:relative; flex:1; background:#000; overflow:hidden; touch-action:none; }

  #dos { position:absolute; inset:0; }
  /* Input goes through the engine API, so the canvas must not swallow stray
     clicks: in Wolf3D a mouse click fires the gun. */
  #dos canvas { image-rendering: pixelated; pointer-events: none; }
  /* strip js-dos chrome: sidebar (save/fullscreen/turbo/volume/gear), soft keyboard */
  #dos .sidebar { display:none !important; }
  #dos .hg-theme-default { display:none !important; }
  #dos .background-image { left:0 !important; width:100% !important; }

  #boot { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:#000; color:#666; font-size:13px; z-index:6; }
  #boot.hide { display:none; }

  #hud { position:absolute; inset:0; pointer-events:none; z-index:10; }
  .act { position:absolute; bottom:calc(16px + env(safe-area-inset-bottom));
    width:104px; height:104px; border-radius:999px; pointer-events:auto;
    touch-action:none; user-select:none; -webkit-user-select:none;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:13px; letter-spacing:1.5px;
    color:rgba(255,255,255,.9); background:rgba(255,255,255,.06);
    border:2px solid rgba(255,255,255,.30);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  #door { left:calc(16px + env(safe-area-inset-left)); }
  #fire { right:calc(16px + env(safe-area-inset-right));
    background:rgba(255,70,70,.10); border-color:rgba(255,110,110,.45); }
  .act.on, .act:active { background:rgba(255,255,255,.30); border-color:#fff; }
  #fire.on, #fire:active { background:rgba(255,70,70,.45); border-color:#ff9a9a; }

  .panel { position:fixed; inset:0; z-index:50; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; padding:24px; text-align:center;
    background:radial-gradient(900px 620px at 50% 28%, #1c1c30 0%, #000 72%); }
  .panel.hide { display:none; }
  .panel h1 { margin:0; font-size:clamp(22px,5.5vw,40px); letter-spacing:2px; font-weight:800; }
  .panel .q { margin:0; color:#9a9a9a; font-size:15px; }
  .pick { display:flex; gap:16px; margin-top:10px; flex-wrap:wrap; justify-content:center; }
  .pick button { min-width:180px; padding:20px 24px; border-radius:18px; cursor:pointer;
    background:#1c1c2a; color:#fff; border:1px solid #333; font-size:16px; font-weight:700; }
  .pick button:hover, .pick button:active { border-color:#8a8a8a; background:#26263a; }
  .pick .ico { display:block; font-size:30px; margin-bottom:8px; }

  .cards { display:flex; gap:16px; margin-top:8px; flex-wrap:wrap; justify-content:center; }
  .card { width:200px; padding:18px; border-radius:18px; cursor:pointer; text-align:left;
    background:#1c1c2a; color:#fff; border:1px solid #333; }
  .card:hover, .card:active { border-color:#8a8a8a; background:#26263a; }
  .card .t { font-size:17px; font-weight:800; margin-bottom:4px; }
  .card .s { font-size:12px; color:#9a9a9a; }
  .card.off { opacity:.45; cursor:not-allowed; }
  .card.off:hover { border-color:#333; background:#1c1c2a; }
  #gnote { min-height:18px; color:#c9a227; font-size:13px; max-width:520px; }

  /* menu helper: one button per Wolf3D menu line */
  /* compact bar at the bottom so the game menu stays visible while stepping */
  #mh { position:absolute; left:0; right:0; bottom:calc(6px + env(safe-area-inset-bottom));
    z-index:20; display:none; justify-content:center; padding:0 8px; pointer-events:none; }
  #mh.show { display:flex; }
  #mh .box { pointer-events:auto; background:rgba(16,16,24,.88); border:1px solid #2c2c3c;
    border-radius:14px; padding:7px; display:flex; flex-direction:row; gap:7px; align-items:center;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #mh .box h3 { display:none; }
  #mh button { padding:11px 14px; border-radius:10px; background:#1e1e2c; color:#eee;
    border:1px solid #333; font-size:14px; font-weight:700; cursor:pointer; }
  #mh button:active { background:#c9a227; color:#111; }
  #mh .close { background:#2a1a1a; border-color:#5a2a2a; color:#e8a0a0; padding:11px 12px; }
  #mhbtn { position:absolute; top:calc(10px + env(safe-area-inset-top)); right:calc(10px + env(safe-area-inset-right));
    width:46px; height:46px; border-radius:12px; pointer-events:auto; touch-action:none;
    background:rgba(20,20,28,.55); border:1px solid rgba(255,255,255,.25); color:#fff;
    font-size:20px; display:flex; align-items:center; justify-content:center;
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }

  /* saves panel */
  #sv { position:absolute; inset:0; z-index:22; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,.75); padding:14px; }
  #sv.show { display:flex; }
  #sv .box { background:#14141d; border:1px solid #2c2c3c; border-radius:16px; padding:14px;
    display:flex; flex-direction:column; gap:9px; width:100%; max-width:440px; max-height:100%; overflow:auto; }
  #sv h3 { margin:0; font-size:13px; color:#9a9a9a; letter-spacing:1px; }
  #sv input { padding:11px; border-radius:10px; border:1px solid #333; background:#0e0e15; color:#eee; font-size:14px; }
  #sv button { padding:11px; border-radius:10px; background:#1e1e2c; color:#eee; border:1px solid #333;
    font-size:14px; font-weight:700; cursor:pointer; text-align:left; }
  #sv button.primary { background:#c9a227; color:#111; border:0; text-align:center; }
  #sv button:active { background:#2a2a3c; }
  #sv .row2 { display:flex; gap:8px; }
  #sv .row2 input { flex:1; }
  #sv .slot { display:flex; justify-content:space-between; align-items:center; }
  #sv .slot .meta { font-size:11px; color:#8a8a8a; font-weight:400; }
  #sv .msg { font-size:12px; color:#c9a227; min-height:15px; }
  #sv .close { background:#2a1a1a; border-color:#5a2a2a; color:#e8a0a0; text-align:center; }
  #svbtn { position:absolute; top:calc(10px + env(safe-area-inset-top)); right:calc(64px + env(safe-area-inset-right));
    width:46px; height:46px; border-radius:12px; pointer-events:auto; touch-action:none;
    background:rgba(20,20,28,.55); border:1px solid rgba(255,255,255,.25); color:#fff;
    font-size:17px; display:flex; align-items:center; justify-content:center;
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }

  #guide .rows { display:flex; flex-direction:column; gap:10px; margin:6px 0 4px;
    width:100%; max-width:520px; }
  #guide .row { display:flex; align-items:center; gap:14px; text-align:left;
    background:#15151f; border:1px solid #262636; border-radius:14px; padding:12px 14px; }
  #guide .g { flex:0 0 78px; font-weight:800; color:#c9a227; font-size:13px; letter-spacing:.5px; }
  #guide .d { font-size:14px; color:#d8d8d8; }
  #guide button { margin-top:6px; padding:14px 30px; border-radius:14px; cursor:pointer;
    background:#c9a227; color:#111; border:0; font-size:16px; font-weight:800; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="dos"></div>
    <div id="boot">Loading Wolfenstein 3D…</div>
    <div id="hud" hidden>
      <div class="act" id="door">DOOR</div>
      <div class="act" id="fire">FIRE</div>
      <div id="mhbtn" title="Game menu">☰</div>
      <div id="svbtn" title="Saves">💾</div>
    </div>
  </div>
</div>

<div id="sv">
  <div class="box">
    <h3>SAVES — synced to your GitHub repo</h3>
    <div id="sv-tokenwrap">
      <input id="sv-token" type="password" placeholder="GitHub token (paste once per device)" autocomplete="off">
      <div class="row2" style="margin-top:8px"><button class="primary" id="sv-savetoken">Save token</button></div>
    </div>
    <div class="row2">
      <input id="sv-name" placeholder="Save name (e.g. castle-3)">
      <button class="primary" id="sv-do" style="flex:0 0 96px">Save as</button>
    </div>
    <div class="msg" id="sv-msg"></div>
    <h3>CLOUD SAVES</h3>
    <div id="sv-list"></div>
    <button class="close" id="sv-close">Close</button>
  </div>
</div>

<div id="mh">
  <div class="box">
    <button id="mh-up">▲</button>
    <button id="mh-down">▼</button>
    <button id="mh-enter" style="background:#c9a227;color:#111;border:0">Select</button>
    <button id="mh-back" style="background:#2a1a1a;border-color:#5a2a2a;color:#e8a0a0">◀ Back</button>
    <span id="mh-note" style="font-size:11px;color:#c9a227"></span>
    <span id="mh-eng" style="display:none"></span>
    <button class="close" id="mh-close">✕</button>
  </div>
</div>

<div id="choose" class="panel">
  <h1>DOS GAMES</h1>
  <p class="q">How are you playing?</p>
  <div class="pick">
    <button data-mode="mobile"><span class="ico">📱</span>On a mobile</button>
    <button data-mode="desktop"><span class="ico">💻</span>On a laptop</button>
  </div>
</div>

<div id="guide" class="panel hide">
  <h1 id="guide-title">Controls</h1>
  <div class="rows" id="guide-rows"></div>
  <button id="guide-ok">Got it — pick a game</button>
</div>

<div id="games" class="panel hide">
  <h1>DOS GAMES</h1>
  <p class="q">Pick a game</p>
  <div class="cards">
    <button class="card" data-game="wolf3d">
      <div class="t">Wolfenstein 3D</div>
      <div class="s">shareware · Episode 1</div>
    </button>
    <button class="card off" data-game="roadrash">
      <div class="t">Road Rash</div>
      <div class="s">not available — commercial game</div>
    </button>
  </div>
  <div id="gnote"></div>
</div>

<script src="vendor/js-dos8/js-dos.js?v=2"></script>
<script>
(function () {
  var stage  = document.getElementById('stage');
  var boot   = document.getElementById('boot');
  var hud    = document.getElementById('hud');
  var choose = document.getElementById('choose');
  var guide  = document.getElementById('guide');
  var games  = document.getElementById('games');
  var gnote  = document.getElementById('gnote');
  var GAMES  = { wolf3d: { url: 'wolf3d.jsdos' } };
  var mode = null, started = false, dos = null;

  function goFull() {
    var el = document.documentElement;
    try { (el.requestFullscreen || el.webkitRequestFullscreen || function () {}).call(el); } catch (e) {}
    try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {}); } catch (e) {}
  }

  /* ---------- key injection ----------
     Synthetic DOM key events do NOT reach the game (only real ones do), but js-dos's
     own engine API does: ci.sendKeyEvent(code, isDown). The vendored js-dos is patched
     to expose that object as window.__ci. Codes are the engine's key codes. */
  var CODES = { ArrowUp:265, ArrowDown:264, ArrowLeft:263, ArrowRight:262,
                Enter:257, Escape:256, ' ':32, Control:341 };
  var MIN_HOLD = 120;
  var held = {};

  function ci() { return window.__ci || null; }

  function send(type, code) {
    var c = ci();
    if (c && c.sendKeyEvent) { try { c.sendKeyEvent(code, type === 'keydown'); return true; } catch (e) {} }
    return false;
  }

  function press(k) {
    if (held[k]) return;
    held[k] = Date.now();
    send('keydown', CODES[k]);
  }
  function release(k) {
    if (!held[k]) return;
    var t = held[k]; delete held[k];
    var wait = MIN_HOLD - (Date.now() - t);
    if (wait > 0) setTimeout(function () { if (!held[k]) send('keyup', CODES[k]); }, wait);
    else send('keyup', CODES[k]);
  }
  function releaseAll() { clearTimeout(pendTimer); Object.keys(held).forEach(release); }
  function tapKey(k) { press(k); setTimeout(function () { release(k); }, MIN_HOLD); }

  /* bootstrap: window.__ci is captured inside js-dos's own key handler, so one
     synthetic key event (ignored by the game) is enough to expose it - no real
     keyboard needed, which is the whole point on a phone. */
  function bootstrapCi() {
    var tries = 0;
    var iv = setInterval(function () {
      if (ci() || ++tries > 120) { clearInterval(iv); return; }
      var ev;
      try { ev = new KeyboardEvent('keydown', { key:'F12', code:'F12', bubbles:true, cancelable:true }); }
      catch (e) { ev = document.createEvent('Event'); ev.initEvent('keydown', true, true); }
      try { Object.defineProperty(ev, 'keyCode', { get:function(){ return 123; } }); } catch (e) {}
      try { Object.defineProperty(ev, 'which',   { get:function(){ return 123; } }); } catch (e) {}
      try { window.dispatchEvent(ev); } catch (e) {}
    }, 400);
  }

  /* ---------- gestures ---------- */
  var origin = null, moved = false, curKey = null, lpTimer = null, lpFired = false;
  var touchSeen = 0;   /* touch devices also emit synthetic mouse events - ignore those */
  function onAct(t) { return t && t.closest && t.closest('.act'); }
  /* Turning felt too quick: the left/right key is now held for ~80% of the swipe
     (it starts 60ms in), so each swipe turns 20% less. Tune H_TURN_DELAY to
     taste - bigger = slower turning. */
  var H_TURN_DELAY = 60;
  var pendTimer = null;
  function setDir(k) {
    if (curKey === k) return;
    clearTimeout(pendTimer);
    if (curKey) release(curKey);
    curKey = k;
    if (!k) return;
    if (k === 'ArrowLeft' || k === 'ArrowRight') {
      var kk = k;
      pendTimer = setTimeout(function () { if (curKey === kk) press(kk); }, H_TURN_DELAY);
    } else {
      press(k);
    }
  }
  function start(e) {
    if (!started) return;
    if (e.type === 'touchstart') touchSeen = Date.now();
    else if (Date.now() - touchSeen < 1000) return;
    /* never treat a touch on our own UI (panels, menu helper, saves, buttons)
       as a game gesture - that is what made the helper's Up/Down fire Enter */
    if (e.target.closest && e.target.closest('.panel, #mh, #sv, .act, #mhbtn, #svbtn')) return;
    if (onAct(e.target)) return;
    var t = e.touches ? e.touches[0] : e;
    if (!t) return;
    origin = { x:t.clientX, y:t.clientY, t:Date.now() }; moved = false; lpFired = false;
    clearTimeout(lpTimer);
    lpTimer = setTimeout(function () {
      if (moved || !origin) return;
      lpFired = true; tapKey('Escape');
    }, 600);
  }
  function move(e) {
    if (!origin) return;
    if (e.type !== 'touchmove' && Date.now() - touchSeen < 1000) return;
    var t = e.touches ? e.touches[0] : e;
    if (!t) return;
    var dx = t.clientX - origin.x, dy = t.clientY - origin.y;
    var ax = Math.abs(dx), ay = Math.abs(dy), T = 14;
    if (ax < T && ay < T) { setDir(null); return; }
    moved = true; clearTimeout(lpTimer);
    if (ax > ay) setDir(dx < 0 ? 'ArrowLeft' : 'ArrowRight');
    else         setDir(dy < 0 ? 'ArrowUp'   : 'ArrowDown');
  }
  var lastEnd = 0;
  function end(e) {
    if (e && e.type !== 'touchend' && e.type !== 'touchcancel' && Date.now() - touchSeen < 1000) return;
    /* a touch tap also fires a synthetic mouseup - run once per gesture */
    if (Date.now() - lastEnd < 80) { clearTimeout(lpTimer); origin = null; return; }
    lastEnd = Date.now();
    clearTimeout(lpTimer);

    var t = (e && e.changedTouches && e.changedTouches[0]) || origin;
    var dx = (t && origin) ? t.clientX - origin.x : 0;
    var dy = (t && origin) ? t.clientY - origin.y : 0;
    var dist = Math.max(Math.abs(dx), Math.abs(dy));

    /* a quick flick may not produce touchmove at all - treat the final
       displacement as a one-step swipe instead of a tap */
    if (origin && !moved && !lpFired && dist >= 12) {
      var k = Math.abs(dx) > Math.abs(dy)
        ? (dx < 0 ? 'ArrowLeft' : 'ArrowRight')
        : (dy < 0 ? 'ArrowUp' : 'ArrowDown');
      moved = true;
      tapKey(k);
    }

    var held_ms = origin ? (Date.now() - origin.t) : 999;
    var wasTap = origin && !moved && !lpFired && dist < 10 && held_ms < 300;
    setDir(null); releaseAll(); origin = null;
    if (wasTap) tapKey('Enter');
  }
  document.addEventListener('touchstart', start, { capture:true, passive:true });
  document.addEventListener('touchmove',  move,  { capture:true, passive:false });
  document.addEventListener('touchend',   end,   { capture:true });
  document.addEventListener('touchcancel', function () { clearTimeout(lpTimer); setDir(null); releaseAll(); origin = null; }, { capture:true });
  document.addEventListener('mousedown', start, true);
  document.addEventListener('mousemove', move, true);
  document.addEventListener('mouseup', end, true);

  function bindAct(el, key) {
    function down(e) { e.preventDefault(); e.stopPropagation(); el.classList.add('on'); press(key); }
    function up(e)   { if (e) e.stopPropagation(); el.classList.remove('on'); release(key); }
    /* Touch devices also emit synthetic mouse events at the touch point. A swipe
       that ends over FIRE would otherwise fire the gun and waste ammo. */
    function mouseDown(e) { if (Date.now() - touchSeen < 1500) return; down(e); }
    function mouseUp(e)   { if (Date.now() - touchSeen < 1500) return; up(e); }
    el.addEventListener('touchstart', down, { passive:false });
    el.addEventListener('touchend', up);
    el.addEventListener('touchcancel', up);
    el.addEventListener('mousedown', mouseDown);
    el.addEventListener('mouseup', mouseUp);
    el.addEventListener('mouseleave', mouseUp);
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }
  /* ---------- Wolf3D menu helper ----------
     The Options menu is a DOS mouse menu and its highlight does not follow our
     synthetic cursor, so every click confirmed whatever was already highlighted.
     These buttons click at the exact screen position of each menu line. */
  var MENU_ITEMS = ['New Game','Sound','Control','Load Game','Save Game',
                    'Change View','Read This!','View Scores','Back to Demo','Quit'];
  function canvasPoint(ix, iy) {
    var el = pad(); if (!el) return null;
    var r = el.getBoundingClientRect();
    return { x: r.left + r.width * (ix / 320), y: r.top + r.height * (iy / 200) };
  }
  /* Drive the menu with keys instead of clicks: press Up many times to guarantee
     the cursor is clamped at the top (the menu does not wrap), then step Down to
     the wanted line and press Enter. Deterministic, no gestures involved. */
  function stepKey(name, done) {
    press(name);
    setTimeout(function () { release(name); setTimeout(done, 120); }, MIN_HOLD);
  }
  function note(t) {
    var n = document.getElementById('mh-note');
    if (n) n.textContent = t || '';
  }
  function tapMenuLine(idx) {
    /* Works from ANY screen: Esc opens the Options menu, 12 Ups clamp the cursor
       on 'New Game' (the menu does not wrap), then step Down to the wanted line
       and press Enter. For New Game we also confirm the episode and difficulty
       screens so it lands in the game. */
    var steps = [];
    steps.push(['Escape', 700]);
    for (var i = 0; i < 12; i++) steps.push(['ArrowUp', 170]);
    for (var d = 0; d < idx; d++) steps.push(['ArrowDown', 170]);
    steps.push(['Enter', 900]);
    if (idx === 0) { steps.push(['Enter', 1200]); steps.push(['Enter', 1200]); }

    note('Starting: ' + MENU_ITEMS[idx] + '…');
    var k = 0;
    (function run() {
      if (k >= steps.length) {
        note('Done — if the game did not start, tell me what is on screen.');
        setTimeout(function () { document.getElementById('mh').classList.remove('show'); }, 800);
        return;
      }
      var step = steps[k++];
      stepKey(step[0], function () { setTimeout(run, step[1]); });
    })();
  }
  (function buildMenuHelper() {
    /* One key per tap, generously spaced: rapid presses get dropped by the
       emulator, so you drive the cursor yourself and watch it move. */
    var busy = false;
    function one(name) {
      if (busy) return;
      busy = true;
      note(name === 'Enter' ? 'Select' : name === 'Escape' ? 'Back' : (name === 'ArrowUp' ? 'Up' : 'Down'));
      stepKey(name, function () { setTimeout(function () { busy = false; }, 260); });
    }
    document.getElementById('mh-up').addEventListener('click', function (e) { e.stopPropagation(); one('ArrowUp'); });
    document.getElementById('mh-down').addEventListener('click', function (e) { e.stopPropagation(); one('ArrowDown'); });
    document.getElementById('mh-enter').addEventListener('click', function (e) { e.stopPropagation(); one('Enter'); });
    document.getElementById('mh-back').addEventListener('click', function (e) { e.stopPropagation(); one('Escape'); });

    document.getElementById('mhbtn').addEventListener('click', function (e) {
      e.stopPropagation();
      var eng = document.getElementById('mh-eng');
      eng.textContent = ci() ? 'engine bridge: connected ✓' : 'engine bridge: NOT connected ✗ (game not started, or old cached script)';
      eng.style.color = ci() ? '#7ec27e' : '#e8a0a0';
      document.getElementById('mh').classList.add('show');
    });
    document.getElementById('mh-close').addEventListener('click', function (e) {
      e.stopPropagation();
      document.getElementById('mh').classList.remove('show');
    });
  })();

  /* ---------------- saves (GitHub-backed, option B) ----------------
     The DOS filesystem lives in OPFS at /jsdos/saves. A save = that subtree,
     serialised to JSON and stored as saves/<name>.json in the repo. Reading is
     public (the repo is public); writing needs a token pasted once per device. */
  var GH_OWNER = 'akshaybangalorekar', GH_REPO = 'game-night', GH_DIR = 'saves';
  var TOKEN_KEY = 'dosgames.ghtoken';

  function b64enc(u8) { var s=''; for (var i=0;i<u8.length;i++) s+=String.fromCharCode(u8[i]); return btoa(s); }
  function b64dec(str) { var bin=atob(str), u8=new Uint8Array(bin.length); for (var i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i); return u8; }

  async function snapSaves() {
    var root = await navigator.storage.getDirectory();
    var out = {};
    async function walk(dir, path, depth) {
      if (depth > 4) return;
      for await (const [name, h] of dir.entries()) {
        var p = path + '/' + name;
        if (h.kind === 'file') {
          var f = await h.getFile();
          out[p] = b64enc(new Uint8Array(await f.arrayBuffer()));
        } else { out[p + '/'] = null; await walk(h, p, depth + 1); }
      }
    }
    var jsdos;
    try { jsdos = await root.getDirectoryHandle('jsdos'); } catch (e) { return out; }
    var saves;
    try { saves = await jsdos.getDirectoryHandle('saves'); } catch (e) { return out; }
    await walk(saves, '/jsdos/saves', 0);
    return out;
  }

  async function restoreSaves(snap) {
    var root = await navigator.storage.getDirectory();
    async function ensure(parts) {
      var d = root;
      for (var i = 0; i < parts.length; i++) d = await d.getDirectoryHandle(parts[i], { create:true });
      return d;
    }
    for (var key in snap) {
      if (!Object.prototype.hasOwnProperty.call(snap, key)) continue;
      var rel = key.replace(/^\/jsdos\//, '');
      if (key.charAt(key.length - 1) === '/') { await ensure(rel.slice(0, -1).split('/')); continue; }
      var parts = rel.split('/'); var fname = parts.pop();
      var dir = await ensure(parts);
      var fh = await dir.getFileHandle(fname, { create:true });
      var w = await fh.createWritable();
      await w.write(b64dec(snap[key]));
      await w.close();
    }
  }

  function ghHeaders() {
    var t = localStorage.getItem(TOKEN_KEY);
    return t ? { 'Authorization': 'Bearer ' + t, 'Accept': 'application/vnd.github+json' } : { 'Accept': 'application/vnd.github+json' };
  }

  async function ghPut(name, obj) {
    var api = 'https://api.github.com/repos/' + GH_OWNER + '/' + GH_REPO + '/contents/' + GH_DIR + '/' + encodeURIComponent(name) + '.json';
    var body = { message: 'Save: ' + name, content: btoa(unescape(encodeURIComponent(JSON.stringify(obj)))) };
    var cur = await fetch(api, { headers: ghHeaders() });
    if (cur.ok) { var j = await cur.json(); if (j && j.sha) body.sha = j.sha; }
    var res = await fetch(api, { method:'PUT', headers: Object.assign({ 'Content-Type':'application/json' }, ghHeaders()), body: JSON.stringify(body) });
    if (!res.ok) throw new Error('GitHub ' + res.status + ' ' + (await res.text()).slice(0, 120));
    return true;
  }

  async function ghList() {
    var api = 'https://api.github.com/repos/' + GH_OWNER + '/' + GH_REPO + '/contents/' + GH_DIR;
    var res = await fetch(api, { headers: ghHeaders() });
    if (res.status === 404) return [];
    if (!res.ok) throw new Error('GitHub ' + res.status);
    var arr = await res.json();
    return Array.isArray(arr) ? arr.filter(function (f) { return /\.json$/.test(f.name); }) : [];
  }

  async function ghGet(name) {
    var api = 'https://api.github.com/repos/' + GH_OWNER + '/' + GH_REPO + '/contents/' + GH_DIR + '/' + encodeURIComponent(name) + '.json';
    var res = await fetch(api, { headers: ghHeaders() });
    if (!res.ok) throw new Error('GitHub ' + res.status);
    var j = await res.json();
    return JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g, '')))));
  }

  function svMsg(t) { document.getElementById('sv-msg').textContent = t; }

  async function refreshList() {
    var list = document.getElementById('sv-list');
    list.innerHTML = '<div class="meta" style="font-size:12px;color:#8a8a8a">Loading…</div>';
    try {
      var files = await ghList();
      list.innerHTML = '';
      if (!files.length) { list.innerHTML = '<div style="font-size:12px;color:#8a8a8a">No cloud saves yet.</div>'; return; }
      files.forEach(function (f) {
        var name = f.name.replace(/\.json$/, '');
        var b = document.createElement('button');
        b.className = 'slot';
        b.innerHTML = '<span>' + name + '</span><span class="meta">load</span>';
        b.addEventListener('click', function (e) { e.stopPropagation(); loadSlot(name); });
        list.appendChild(b);
      });
    } catch (e) {
      var m = /Failed to fetch/i.test(e.message) ? 'Could not reach GitHub — check your connection.' : e.message;
      list.innerHTML = '<div style="font-size:12px;color:#e8a0a0">' + m + '</div>';
    }
  }

  async function saveSlot() {
    var name = (document.getElementById('sv-name').value || '').trim();
    if (!name) { svMsg('Give the save a name first.'); return; }
    if (!localStorage.getItem(TOKEN_KEY)) { svMsg('Paste your GitHub token first.'); return; }
    svMsg('Saving…');
    try {
      var snap = await snapSaves();
      var n = Object.keys(snap).length;
      if (!n) { svMsg('No save files yet. In the game press Save Game (☰ menu → Save Game), then try again.'); return; }
      await ghPut(name, { name:name, when:new Date().toISOString(), files:snap });
      svMsg('Saved "' + name + '" (' + n + ' files) to GitHub.');
      refreshList();
    } catch (e) { svMsg('Save failed: ' + (/Failed to fetch/i.test(e.message) ? 'could not reach GitHub' : e.message)); }
  }

  async function loadSlot(name) {
    svMsg('Loading "' + name + '"…');
    try {
      var data = await ghGet(name);
      await restoreSaves(data.files || {});
      svMsg('Loaded. Restarting the game…');
      setTimeout(function () { location.reload(); }, 700);
    } catch (e) { svMsg('Load failed: ' + (/Failed to fetch/i.test(e.message) ? 'could not reach GitHub' : e.message)); }
  }

  (function wireSaves() {
    var panel = document.getElementById('sv');
    var tw = document.getElementById('sv-tokenwrap');
    function syncTokenRow() { tw.style.display = localStorage.getItem(TOKEN_KEY) ? 'none' : 'block'; }
    syncTokenRow();
    document.getElementById('svbtn').addEventListener('click', function (e) {
      e.stopPropagation(); panel.classList.add('show'); svMsg(''); refreshList();
    });
    document.getElementById('sv-close').addEventListener('click', function (e) {
      e.stopPropagation(); panel.classList.remove('show');
    });
    document.getElementById('sv-savetoken').addEventListener('click', function (e) {
      e.stopPropagation();
      var v = (document.getElementById('sv-token').value || '').trim();
      if (!v) { svMsg('Paste a token first.'); return; }
      localStorage.setItem(TOKEN_KEY, v);
      syncTokenRow(); svMsg('Token stored on this device.'); refreshList();
    });
    document.getElementById('sv-do').addEventListener('click', function (e) { e.stopPropagation(); saveSlot(); });
  })();

  bindAct(document.getElementById('door'), ' ');
  bindAct(document.getElementById('fire'), 'Control');

  /* ---------- guide ---------- */
  var GUIDES = {
    mobile: [
      ['SWIPE ↑ ↓', 'Walk forward and back'],
      ['SWIPE ← →', 'Turn left and right'],
      ['TAP', 'Select (New Game, Save Game…)'],
      ['HOLD', 'Esc — back out of any menu'],
      ['DOOR', 'Open doors and use lifts'],
      ['FIRE', 'Shoot']
    ],
    desktop: [
      ['↑ ↓ ← →', 'Walk and turn'],
      ['Ctrl', 'Fire'],
      ['Space', 'Open doors and use lifts'],
      ['Enter', 'Select'],
      ['Esc', 'Menu / back'],
      ['F2 / F3', 'Save / load']
    ]
  };
  function showGuide(m) {
    document.getElementById('guide-title').textContent = (m === 'mobile' ? 'Touch controls' : 'Keyboard controls');
    var box = document.getElementById('guide-rows'); box.innerHTML = '';
    GUIDES[m].forEach(function (r) {
      var d = document.createElement('div'); d.className = 'row';
      var g = document.createElement('div'); g.className = 'g'; g.textContent = r[0];
      var t = document.createElement('div'); t.className = 'd'; t.textContent = r[1];
      d.appendChild(g); d.appendChild(t); box.appendChild(d);
    });
    guide.classList.remove('hide');
  }

  /* ---------- flow ---------- */
  choose.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-mode]');
    if (!b) return;
    mode = b.getAttribute('data-mode');
    choose.classList.add('hide');
    showGuide(mode);
  });

  document.getElementById('guide-ok').addEventListener('click', function () {
    guide.classList.add('hide');
    games.classList.remove('hide');
  });

  games.addEventListener('click', function (e) {
    var c = e.target.closest('.card[data-game]');
    if (!c) return;
    var id = c.getAttribute('data-game');
    if (!GAMES[id]) {
      gnote.textContent = 'Road Rash is a commercial EA game — there is no free version I can host. Pick Wolfenstein, or tell me a racer to add.';
      return;
    }
    games.classList.add('hide');
    goFull();
    hud.hidden = (mode !== 'mobile');
    startGame(id);
  });

  function startGame(id) {
    if (started) return;
    started = true;
    var g = GAMES[id] || GAMES.wolf3d;
    try {
      dos = Dos(document.getElementById('dos'), {
        url: g.url,
        pathPrefix: 'vendor/js-dos8/emulators/',
        autoStart: true
      });
      try { if (dos.setMouseCapture) dos.setMouseCapture(true); } catch (e) {}
      bootstrapCi();
      /* hide the loading veil once the emulator has produced a canvas */
      var poll = setInterval(function () {
        if (document.querySelector('#dos canvas')) { boot.classList.add('hide'); clearInterval(poll); }
      }, 500);
      setTimeout(function () { boot.classList.add('hide'); }, 25000);
    } catch (err) {
      boot.innerHTML = 'Could not start the emulator: ' + (err && err.message ? err.message : err);
    }
  }
})();
</script>
