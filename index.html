<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>DOS Games</title>
<link rel="stylesheet" href="vendor/js-dos/js-dos.css">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:#000; color:#eaeaea; overflow:hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { position:fixed; inset:0; display:flex; flex-direction:column; }
  #stage { position:relative; flex:1; background:#000; overflow:hidden; }

  #dos { position:absolute; inset:0; }
  #dos canvas { image-rendering: pixelated; }
  /* strip js-dos chrome (sidebar, volume, soft keyboard) — we supply our own input */
  #dos > .flex-grow-0 { display:none !important; }
  #dos .hg-theme-default { display:none !important; }
  #dos .emulator-root { width:100%; height:100%; }
  #dos .emulator-canvas { max-width:100%; max-height:100%; }

  #boot { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:#000; color:#666; font-size:13px; letter-spacing:.5px; z-index:6; }
  #boot.hide { display:none; }

  /* two transparent thumb buttons, overlaid */
  #hud { position:absolute; inset:0; pointer-events:none; z-index:10; }
  .act { position:absolute; bottom:calc(16px + env(safe-area-inset-bottom));
    width:104px; height:104px; border-radius:999px; pointer-events:auto;
    touch-action:none; user-select:none; -webkit-user-select:none;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:13px; letter-spacing:1.5px;
    color:rgba(255,255,255,.9); background:rgba(255,255,255,.06);
    border:2px solid rgba(255,255,255,.30);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    transition: background .08s, border-color .08s; }
  #door { left:calc(16px + env(safe-area-inset-left)); }
  #fire { right:calc(16px + env(safe-area-inset-right));
    background:rgba(255,70,70,.10); border-color:rgba(255,110,110,.45); }
  .act.on, .act:active { background:rgba(255,255,255,.30); border-color:#fff; }
  #fire.on, #fire:active { background:rgba(255,70,70,.45); border-color:#ff9a9a; }

  /* the mobile / laptop gate */
  #choose { position:fixed; inset:0; z-index:50; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; padding:24px; text-align:center;
    background:radial-gradient(900px 620px at 50% 28%, #1c1c30 0%, #000 72%); }
  #choose.hide { display:none; }
  #choose h1 { margin:0; font-size:clamp(26px,6vw,46px); letter-spacing:3px; font-weight:800; }
  #choose .q { margin:0; color:#9a9a9a; font-size:15px; }
  .pick { display:flex; gap:16px; margin-top:10px; flex-wrap:wrap; justify-content:center; }
  .pick button { min-width:180px; padding:20px 24px; border-radius:18px; cursor:pointer;
    background:#1c1c2a; color:#fff; border:1px solid #333; font-size:16px; font-weight:700; }
  .pick button:hover, .pick button:active { border-color:#8a8a8a; background:#26263a; }
  .pick .ico { display:block; font-size:30px; margin-bottom:8px; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="dos"></div>
    <div id="boot">Loading Wolfenstein 3D…</div>
    <div id="hud" hidden>
      <div class="act" id="door">DOOR</div>
      <div class="act" id="fire">FIRE</div>
    </div>
  </div>
</div>

<div id="choose">
  <h1>DOS GAMES</h1>
  <p class="q">How are you playing?</p>
  <div class="pick">
    <button data-mode="mobile"><span class="ico">📱</span>On a mobile</button>
    <button data-mode="desktop"><span class="ico">💻</span>On a laptop</button>
  </div>
</div>

<script src="vendor/js-dos/js-dos.js"></script>
<script>
(function () {
  var stage  = document.getElementById('stage');
  var boot   = document.getElementById('boot');
  var hud    = document.getElementById('hud');
  var choose = document.getElementById('choose');
  var mode   = null;
  var started = false;

  /* ---------- fullscreen (needs the click that picked the mode) ---------- */
  function goFull() {
    var el = document.documentElement;
    try { (el.requestFullscreen || el.webkitRequestFullscreen || function () {}).call(el); } catch (e) {}
    try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {}); } catch (e) {}
  }

  /* ---------- keyboard plumbing ---------- */
  var CODES = { ArrowUp:38, ArrowDown:40, ArrowLeft:37, ArrowRight:39, ' ':32, Control:17 };
  var held = {};
  function pad() { return document.querySelector('#dos canvas') || document.getElementById('dos'); }
  function emit(type, key, code) {
    var el = pad(); if (!el) return;
    var ev;
    try { ev = new KeyboardEvent(type, { key:key, code:key, keyCode:code, which:code, bubbles:true, cancelable:true }); }
    catch (e) { ev = document.createEvent('Event'); ev.initEvent(type, true, true); ev.key = key; ev.keyCode = code; ev.which = code; }
    try { el.dispatchEvent(ev); } catch (e) {}
    try { document.dispatchEvent(new KeyboardEvent(type, { key:key, keyCode:code, which:code, bubbles:true })); } catch (e) {}
  }
  function press(k)  { if (held[k]) return; held[k] = 1; emit('keydown', k, CODES[k]); }
  function release(k){ if (!held[k]) return; delete held[k]; emit('keyup', k, CODES[k]); }
  function releaseAll() { Object.keys(held).forEach(function (k) { emit('keyup', k, CODES[k]); delete held[k]; }); }

  /* ---------- swipe to move/turn, tap to select ---------- */
  var origin = null, moved = false;
  function isAct(t) { return t && t.closest && t.closest('.act'); }

  function tapSelect() {            // a tap with no swipe = Enter (menu select)
    emit('keydown', 'Enter', 13);
    setTimeout(function () { emit('keyup', 'Enter', 13); }, 70);
  }
  function pStart(e) {
    if (isAct(e.target)) return;
    var t = e.touches ? e.touches[0] : e;
    origin = { x: t.clientX, y: t.clientY };
    moved = false;
  }
  function pMove(e) {
    if (!origin) return;
    var t = e.touches ? e.touches[0] : e;
    var dx = t.clientX - origin.x, dy = t.clientY - origin.y, T = 14;
    var any = false;
    if (dx < -T) { press('ArrowLeft');  any = true; } else release('ArrowLeft');
    if (dx >  T) { press('ArrowRight'); any = true; } else release('ArrowRight');
    if (dy < -T) { press('ArrowUp');    any = true; } else release('ArrowUp');
    if (dy >  T) { press('ArrowDown');  any = true; } else release('ArrowDown');
    if (any) moved = true;
    if (e.cancelable) e.preventDefault();
  }
  function pEnd() {
    var wasTap = origin && !moved;
    origin = null; releaseAll();
    if (wasTap) tapSelect();
  }

  stage.addEventListener('touchstart', pStart, { passive:true });
  stage.addEventListener('touchmove',  pMove,  { passive:false });
  stage.addEventListener('touchend',   pEnd);
  stage.addEventListener('touchcancel', function () { origin = null; releaseAll(); });
  stage.addEventListener('mousedown',  pStart);
  stage.addEventListener('mousemove',  pMove);
  stage.addEventListener('mouseup',    pEnd);

  /* laptop: mouse wheel scrolls menus (up/down) */
  stage.addEventListener('wheel', function (e) {
    e.preventDefault();
    var k = e.deltaY < 0 ? 'ArrowUp' : 'ArrowDown';
    emit('keydown', k, CODES[k]);
    setTimeout(function () { emit('keyup', k, CODES[k]); }, 90);
  }, { passive:false });

  /* ---------- the only two buttons ---------- */
  function bindAct(el, key, code) {
    function down(e) { e.preventDefault(); el.classList.add('on'); held[key] = 1; emit('keydown', key, code); }
    function up(e)   { e.preventDefault(); el.classList.remove('on'); delete held[key]; emit('keyup', key, code); }
    el.addEventListener('touchstart', down, { passive:false });
    el.addEventListener('touchend', up);
    el.addEventListener('touchcancel', up);
    el.addEventListener('mousedown', down);
    el.addEventListener('mouseup', up);
    el.addEventListener('mouseleave', up);
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }
  bindAct(document.getElementById('door'), ' ', 32);       // Space = open door / use
  bindAct(document.getElementById('fire'), 'Control', 17); // Ctrl  = fire

  /* ---------- gate: mobile or laptop ---------- */
  choose.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-mode]');
    if (!b) return;
    mode = b.getAttribute('data-mode');
    choose.classList.add('hide');
    goFull();
    hud.hidden = (mode !== 'mobile');
    start();
  });

  /* if fullscreen is lost, the next tap gets it back — no button needed */
  stage.addEventListener('pointerup', function () {
    if (started && !document.fullscreenElement) goFull();
  });

  /* ---------- boot the emulator ---------- */
  function start() {
    if (started) return;
    started = true;
    try {
      var dos = Dos(document.getElementById('dos'));
      dos.run('wolf3d.jsdos');
      setTimeout(function () { boot.classList.add('hide'); }, 6000);
      stage.addEventListener('pointerdown', function () { boot.classList.add('hide'); }, { once:true });

      /* click through js-dos's first-run welcome wizard */
      var tries = 0;
      var killer = setInterval(function () {
        var b = Array.prototype.slice.call(document.querySelectorAll('*')).filter(function (x) {
          return /^\s*(NEXT|CLOSE)\s*$/i.test((x.textContent || '').trim()) && x.children.length === 0;
        });
        if (b.length) b[b.length - 1].click();
        if (++tries > 60) clearInterval(killer);
      }, 500);
    } catch (err) {
      boot.innerHTML = 'Could not start the emulator: ' + (err && err.message ? err.message : err);
    }
  }
})();
</script>
</body>
</html>
